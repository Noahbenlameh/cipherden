name: Release builds

# Manually triggered (or on a version tag) — this is deliberately separate
# from ci.yml's fast fmt/clippy/test/security checks. Produces an
# installable bundle per OS as a downloadable workflow artifact; nothing
# here is auto-published anywhere, and the app itself makes no network
# calls at runtime regardless of how it was built.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Build release bundle
        run: cargo tauri build
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: cipherden-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            target/release/bundle/**/*.app/**
            target/release/bundle/*.dmg
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/cipherden.exe
